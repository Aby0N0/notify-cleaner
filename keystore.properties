# 固定签名密钥的配置。
#
# 为什么要它：GitHub Actions 每次运行都是全新的机器，Android 默认的 debug 密钥
# 是每台机器现生成的 —— 所以每次编出来的 APK 签名都不一样，手机上覆盖安装会失败
# （提示「签名不一致」或「应用未安装」）。
#
# 把这个密钥提交进仓库，每次都用它签，签名就固定了，以后的新版本能直接覆盖旧版本。
#
# 注意：仓库是公开的，所以这套密码也是公开的。对一个自己用的工具 App 来说可以接受
# （最坏情况是别人也能签一个冒充本 App 的安装包）。如果要换成私有的，
# 把 notify-cleaner.p12 删掉、用 keytool 重新生成一个，然后改成你自己的密码。
storeFile=keystore/notify-cleaner.p12
storeType=pkcs12
storePassword=notifycleaner2026
keyAlias=notifycleaner
keyPassword=notifycleaner2026
