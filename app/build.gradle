plugins {
    id 'com.android.application'
}

// ---------- 读取固定签名密钥的配置 ----------
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace 'com.dsh.notifycleaner'
    compileSdk 35

    defaultConfig {
        applicationId "com.dsh.notifycleaner"
        minSdk 26          // Android 8.0 起；这样就不需要为老系统准备 PNG 图标
        targetSdk 35
        versionCode 13
        versionName "13.0"
    }

    // 固定签名：debug 和 release 都用同一个密钥，保证新版本能覆盖安装旧版本
    signingConfigs {
        release {
            storeFile rootProject.file(keystoreProperties['storeFile'] ?: 'keystore/notify-cleaner.p12')
            storeType keystoreProperties['storeType'] ?: 'pkcs12'
            storePassword keystoreProperties['storePassword'] ?: ''
            keyAlias keystoreProperties['keyAlias'] ?: 'notifycleaner'
            keyPassword keystoreProperties['keyPassword'] ?: ''
        }
    }

    buildTypes {
        debug {
            // 也走固定签名，免得「这次装的是 debug、下次装的是 release」互相冲突
            signingConfig signingConfigs.release
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        // 云编译上别让 lint 的小意见把构建搞挂
        abortOnError false
        checkReleaseBuilds false
    }
}

// 刻意没有 dependencies 块：整个应用只用 Android 框架自带的 API。
